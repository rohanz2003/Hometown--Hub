<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Hometown Hub — connect with your city or village: share local updates, organise events, and keep your community's traditions alive."
    />
    <title>Hometown Hub — your city or village, online</title>

    <!-- Inter: highly legible at the small sizes used on mobile (design.md § 3) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the saved theme before first paint so a dark-mode user never sees a
      white flash. The server copy of this preference wins once the session loads.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hh-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
